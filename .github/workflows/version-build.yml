name: Version & Build

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'New marketing version (e.g. 1.2.3)'
        required: true
      build:
        description: 'New build number (e.g. 123)'
        required: true

jobs:
  ios:
    runs-on: [ios]
    env:
        REPO_DIR: /Users/ci/repos/vocaplay-main
        
    steps:
      - name: Ensure working copy for branch
        run: |
          mkdir -p "$(dirname "$REPO_DIR")"
          if [ ! -d "$REPO_DIR/.git" ]; then
            git clone git@github.com-CI:romanandreyvich/VocaPlay.git "$REPO_DIR"
          fi
          cd "$REPO_DIR"
          git fetch origin --tags
          git checkout main
          git reset --hard origin/main

      - name: Configure git author for CI
        run: |
          cd "$REPO_DIR"
          git config user.name "CI Bot"
          git config user.email "ci-bot@example.com"

      - name: Bump app version
        run: |
          cd "$REPO_DIR"
          fastlane run increment_version_number version_number:${{ inputs.version }}
          fastlane run increment_build_number build_number:${{ inputs.build }}
          
      - name: Commit and push version bump
        run: |
          cd "$REPO_DIR"
          git status --short
          git commit -am "Increased app version to ${{ inputs.version }}"
          git push origin HEAD

      - name: Build project (Debug / simulator)
        run: |
          cd "$REPO_DIR"
          xcodebuild \
            -scheme "voca play" \
            -sdk iphonesimulator \
            -configuration Debug \
            build

      - name: Slack notify (success)
        if: success()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          VERSION="${{ inputs.version }}"
          BUILD="${{ inputs.build }}"
          payload=$(cat <<EOF
          {
            "attachments": [
              {
                "color": "#2EB886",
                "text": "*Build succeeded*\nVersion: ${VERSION} (${BUILD})"
              }
            ]
          }
          EOF
          )
          curl -X POST -H 'Content-type: application/json' --data "$payload" "$SLACK_WEBHOOK_URL"

      - name: Slack notify (failure)
        if: failure()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          VERSION="${{ inputs.version }}"
          BUILD="${{ inputs.build }}"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          ERROR_TEXT=$(tail -n 20 /tmp/ios_build.log 2>/dev/null | sed 's/"/\\"/g')
          if [ -z "$ERROR_TEXT" ]; then
            ERROR_TEXT="No log captured. See run."
          fi
          payload=$(cat <<EOF
          {
            "attachments": [
              {
                "color": "#E01E5A",
                "text": "<!channel> *Build FAILED*\nVersion: ${VERSION} (${BUILD})\nRun: ${RUN_URL}\n\`\`\`${ERROR_TEXT}\`\`\`"
              }
            ]
          }
          EOF
          )
          curl -X POST -H 'Content-type: application/json' --data "$payload" "$SLACK_WEBHOOK_URL"
          exit 1
